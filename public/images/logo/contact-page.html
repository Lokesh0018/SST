<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &mdash; Need support?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red-1:#ff8b74;   /* highlight   */
  --red-2:#f4503a;   /* main body   */
  --red-3:#dc4127;   /* shade       */
  --red-4:#b0301b;   /* deep shade  */
  --page:#f05138;    /* page bg     */
  --card:#f4f1ef;    /* card bg     */
  --ink:#8b8b8b;
  --field:#f6e3df;

  /* ---- ONE knob controls the whole phone's size ---- */
  --cap:186px;       /* diameter of the top cap */
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 20px;
  background:var(--page);
  font-family:"Poppins","Segoe UI",system-ui,sans-serif;
}

/* ---------------- card ---------------- */
.card{
  position:relative; width:min(1000px,100%); background:var(--card);
  border-radius:26px; padding:60px 60px 0; overflow:hidden;
  display:grid; grid-template-columns:minmax(260px,40%) 1fr; gap:40px;
  box-shadow:0 40px 80px rgba(120,25,10,.35);
}

/* ============== TELEPHONE HANDSET ============== */
.phone-stage{position:relative; min-height:800px; z-index:1}

.handset{
  position:absolute; left:75px; top:20px; width:var(--cap);
  display:flex; flex-direction:column; align-items:center;
  transform:rotate(-2deg);
}

/* ---- the flared round caps ---- */
.cap{
  position:relative; width:var(--cap); height:var(--cap); border-radius:50%;
  background:
    radial-gradient(circle at 36% 26%, var(--red-1) 0%, var(--red-2) 44%, var(--red-3) 74%, var(--red-4) 100%);
  box-shadow:
    inset 0 -14px 26px rgba(140,28,12,.34),
    inset 0 14px 24px rgba(255,255,255,.22),
    inset 0 0 0 1px rgba(140,28,12,.10),
    0 22px 34px rgba(170,55,35,.20);
  z-index:2;
}
.cap.bottom{width:calc(var(--cap) * .98); height:calc(var(--cap) * .98)}

/* recessed dish inside the cone */
.dish{
  position:absolute; inset:9%; border-radius:50%;
  background:radial-gradient(circle at 42% 32%, var(--red-1) 0%, var(--red-2) 52%, var(--red-3) 100%);
  box-shadow:
    inset 0 7px 14px rgba(140,28,12,.30),
    inset 0 -8px 14px rgba(255,255,255,.14);
}
/* the spiral groove */
.spiral{position:absolute; inset:6%; width:88%; height:88%; overflow:visible}
.sp-hi{fill:none; stroke:rgba(255,190,170,.40); stroke-width:1.5; transform:translateY(1.1px)}
.sp-dk{fill:none; stroke:rgba(140,28,12,.42); stroke-width:1.9}

/* ---- the tapered bar ---- */
.bar{
  position:relative; width:calc(var(--cap) * .753); height:calc(var(--cap) * 2.043);
  margin:calc(var(--cap) * -.269) 0;
  clip-path:polygon(8.57% 0.00%, 15.03% 3.33%, 19.89% 6.67%, 23.46% 10.00%, 26.02% 13.33%, 27.80% 16.67%, 28.99% 20.00%, 29.76% 23.33%, 30.22% 26.67%, 30.49% 30.00%, 30.62% 33.33%, 30.68% 36.67%, 30.71% 40.00%, 30.71% 43.33%, 30.71% 46.67%, 30.71% 50.00%, 30.71% 53.33%, 30.71% 56.67%, 30.71% 60.00%, 30.68% 63.33%, 30.62% 66.67%, 30.49% 70.00%, 30.22% 73.33%, 29.76% 76.67%, 28.99% 80.00%, 27.80% 83.33%, 26.02% 86.67%, 23.46% 90.00%, 19.89% 93.33%, 15.03% 96.67%, 8.57% 100.00%, 91.43% 100.00%, 84.97% 96.67%, 80.11% 93.33%, 76.54% 90.00%, 73.98% 86.67%, 72.20% 83.33%, 71.01% 80.00%, 70.24% 76.67%, 69.78% 73.33%, 69.51% 70.00%, 69.38% 66.67%, 69.32% 63.33%, 69.29% 60.00%, 69.29% 56.67%, 69.29% 53.33%, 69.29% 50.00%, 69.29% 46.67%, 69.29% 43.33%, 69.29% 40.00%, 69.32% 36.67%, 69.38% 33.33%, 69.51% 30.00%, 69.78% 26.67%, 70.24% 23.33%, 71.01% 20.00%, 72.20% 16.67%, 73.98% 13.33%, 76.54% 10.00%, 80.11% 6.67%, 84.97% 3.33%, 91.43% 0.00%);
  background:linear-gradient(90deg,
    var(--red-4) 0%, var(--red-3) 12%, var(--red-2) 28%,
    var(--red-1) 45%, var(--red-2) 64%, var(--red-3) 85%, var(--red-4) 100%);
  z-index:1;
}
.bar .btn{
  position:absolute; left:50%; top:54%; width:5.5%; aspect-ratio:1; transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, var(--red-3), var(--red-4));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.22);
}
.bar .ce{
  position:absolute; left:50%; top:23%; transform:translateX(-50%);
  font-size:9px; letter-spacing:1px; font-weight:600; color:rgba(140,28,12,.5);
}

/* ---- soft cast shadow of the handset ---- */
.handset.shadow{
  transform:rotate(-2deg) translate(32px,20px); filter:blur(18px); opacity:.28; z-index:0;
}
.handset.shadow .cap, .handset.shadow .bar{background:#8d8079; box-shadow:none}

/* ---- the coiled cord ---- */
.cord{
  position:absolute; left:0; right:0; bottom:-52px; width:100%; height:auto;
  overflow:visible; pointer-events:none; z-index:0;
}
.cord .wire{fill:none; stroke:var(--red-2); stroke-width:5.5; stroke-linecap:round}
.cord .sh{fill:none; stroke:#8d8079; stroke-width:6.5; stroke-linecap:round; opacity:.20; filter:blur(5px)}

/* ============== FORM SIDE ============== */
.form-side{padding:78px 0 128px; position:relative; z-index:1}
.form-side h2{margin:0 0 6px; font-size:21px; font-weight:700; color:var(--red-2)}
.form-side p.sub{margin:0 0 34px; font-size:13px; color:var(--ink); font-weight:300}
.field{margin-bottom:20px}
.field label{display:block; margin-bottom:9px; font-size:12.5px; color:var(--ink); font-weight:400}
.field input, .field textarea{
  width:100%; border:0; background:var(--field); border-radius:6px;
  padding:12px 14px; font:inherit; font-size:14px; color:#5a4a47;
  transition:background .2s, box-shadow .2s; outline:0;
}
.field textarea{height:128px; resize:vertical}
.field input:focus, .field textarea:focus{background:#f9ecea; box-shadow:0 0 0 2px rgba(244,80,58,.35)}
.actions{display:flex; justify-content:flex-end; margin-top:26px}
.submit{
  border:0; cursor:pointer; padding:13px 34px; border-radius:6px;
  background:linear-gradient(135deg,#ff7a5f,#f2492f);
  color:#fff; font:inherit; font-size:12px; font-weight:600; letter-spacing:1.2px;
  box-shadow:0 8px 16px rgba(240,80,55,.35); transition:transform .15s, box-shadow .15s;
}
.submit:hover{transform:translateY(-2px); box-shadow:0 12px 22px rgba(240,80,55,.45)}
.submit:active{transform:translateY(0)}

@media (max-width:860px){
  :root{--cap:150px}
  .card{grid-template-columns:1fr; padding:36px 28px 0}
  .phone-stage{min-height:660px}
  .handset{left:50%; margin-left:calc(var(--cap) / -2); transform:rotate(-2deg)}
  .handset.shadow{transform:rotate(-2deg) translate(26px,16px)}
  .form-side{padding:0 0 120px}
}
</style>
</head>

        <label for="name">Name and surname</label>
        <input id="name" name="name" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field">
